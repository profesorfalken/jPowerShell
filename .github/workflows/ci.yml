name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [11, 17, 21]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Ubuntu runners ship PowerShell 7; on Windows the tests use powershell.exe
      - name: Check PowerShell (Linux/macOS)
        if: runner.os != 'Windows'
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Check PowerShell (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '$PSVersionTable.PSVersion.ToString()'

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}-jdk${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore
